# quadcopter_localization parameters
# All parameters can be overridden at launch time

# Visual Odometry Bridge Parameters
visual_odometry_bridge:
  ros__parameters:
    # Input topics (from V-SLAM / VIO)
    vo_topic: "/slam/odom"                    # nav_msgs/Odometry from ORB-SLAM3 / VINS-Fusion
    imu_topic: "/imu/data"                    # sensor_msgs/Imu (optional, for timestamp sync)
    
    # Output topic (to PX4 via uXRCE-DDS)
    px4_vo_topic: "/fmu/in/vehicle_visual_odometry"  # px4_msgs/VehicleOdometry
    
    # Frame configuration
    vo_frame_id: "odom"                       # Frame of incoming VO (typically 'odom' in ENU)
    vo_child_frame_id: "base_link"            # Child frame of incoming VO (typically 'base_link' in FLU)
    output_frame: "NED"                       # Output frame for PX4: "NED" or "FRD"
    
    # Covariance handling
    use_vo_covariance: true                   # Use covariance from VO message if available
    position_covariance_diag: [0.05, 0.05, 0.1]  # Fallback diagonal [x, y, z] in m^2
    orientation_covariance_diag: [0.01, 0.01, 0.01]  # Fallback diagonal [roll, pitch, yaw] in rad^2
    velocity_covariance_diag: [0.01, 0.01, 0.05]  # Fallback diagonal [vx, vy, vz] in m^2/s^2
    
    # Covariance scaling (inflate if VO is overconfident)
    position_covariance_scale: 1.0
    orientation_covariance_scale: 1.0
    velocity_covariance_scale: 1.0
    
    # Quality filtering
    min_quality_score: 0.5                    # Minimum quality (0-1) to publish to PX4
    max_position_std: 1.0                     # Max position std dev (m) to accept
    max_orientation_std: 0.5                  # Max orientation std dev (rad) to accept
    
    # Reset handling
    reset_counter_topic: ""                   # Optional: topic to monitor for SLAM resets
    handle_resets: true                       # Detect and handle SLAM reset counter jumps
    
    # Timing
    publish_rate_hz: 100                      # Output rate to PX4 (PX4 expects >= 30Hz)
    timeout_ms: 500                           # Max age of VO message to consider valid
    
    # Debug
    debug: false                              # Enable debug logging
    publish_debug_odom: false                 # Publish converted odom on /localization/odom_debug

# Optional: EKF Fusion Node Parameters (for future use)
ekf_fusion:
  ros__parameters:
    frequency: 200.0
    sensor_timeout: 0.5
    two_d_mode: false
    transform_time_offset: 0.0
    transform_timeout: 0.0
