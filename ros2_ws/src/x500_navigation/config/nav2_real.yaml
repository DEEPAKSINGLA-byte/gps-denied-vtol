# nav2_real.yaml - Nav2 costmap config for real GPS-denied hardware (not sim)
# use_sim_time: false everywhere; odom-based local costmap; YDLIDAR scan source

bt_navigator:
  ros__parameters:
    use_sim_time: false

    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

    default_nav_to_pose_bt_xml: /opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml

    navigators: ["navigate_to_pose"]

    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node

    navigate_to_pose:
      plugin: "nav2_bt_navigator/NavigateToPoseNavigator"


bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: false


controller_server:
  ros__parameters:
    use_sim_time: false

    controller_frequency: 10.0

    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01

    failure_tolerance: 0.3

    progress_checker_plugin: progress_checker
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 5.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.20
      yaw_goal_tolerance: 0.30

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"

      debug_trajectory_details: false

      # Safe indoor speeds for real VTOL
      min_vel_x: -0.5
      max_vel_x: 0.5

      min_vel_y: -0.5
      max_vel_y: 0.5

      min_vel_theta: 0.0
      max_vel_theta: 0.0

      min_speed_xy: 0.0
      max_speed_xy: 0.5

      min_speed_theta: 0.0
      max_speed_theta: 0.0

      # Acceleration limits
      acc_lim_x: 0.5
      acc_lim_y: 0.5
      acc_lim_theta: 0.5

      decel_lim_x: -0.5
      decel_lim_y: -0.5
      decel_lim_theta: -0.5

      vx_samples: 15
      vy_samples: 15
      vtheta_samples: 1

      sim_time: 1.0

      linear_granularity: 0.05
      angular_granularity: 0.025

      transform_tolerance: 0.3

      xy_goal_tolerance: 0.20
      trans_stopped_velocity: 0.05

      short_circuit_trajectory_evaluation: true
      stateful: true

      critics:
        - Oscillation
        - BaseObstacle
        - PathAlign
        - PathDist
        - GoalDist

      BaseObstacle.scale: 0.05

      PathAlign.scale: 10.0
      PathAlign.forward_point_distance: 0.20

      PathDist.scale: 20.0
      GoalDist.scale: 20.0


planner_server:
  ros__parameters:
    use_sim_time: false

    expected_planner_frequency: 5.0

    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 5.0
      publish_frequency: 2.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true

      width: 8
      height: 8
      resolution: 0.05

      robot_radius: 0.25

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true
        # Layer-level window too (its min defaults to 0.0 and silently drops every point
        # below odom z = 0, i.e. the whole scan when the drone is on the floor).
        min_obstacle_height: -100.0
        max_obstacle_height: 100.0

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          # 2D lidar: every return lies in the scan plane, so the height window must not
          # filter on odom z. That z = estimated altitude - 0.15 m lidar mount, which is
          # NEGATIVE on the floor and drifts with the baro; a 0.10 m floor here dropped
          # every return whenever the drone sat on the ground (empty costmaps).
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0

          marking: true
          clearing: true

          obstacle_min_range: 0.10
          obstacle_max_range: 8.0

          raytrace_min_range: 0.10
          raytrace_max_range: 8.0

          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.40
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false

      update_frequency: 1.0
      publish_frequency: 1.0

      global_frame: odom
      robot_base_frame: base_link

      rolling_window: true

      width: 20
      height: 20
      resolution: 0.05

      robot_radius: 0.25

      plugins:
        - obstacle_layer
        - inflation_layer

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"

        enabled: true
        # Layer-level window too (its min defaults to 0.0 and silently drops every point
        # below odom z = 0, i.e. the whole scan when the drone is on the floor).
        min_obstacle_height: -100.0
        max_obstacle_height: 100.0

        observation_sources: scan

        scan:
          topic: /scan
          data_type: "LaserScan"
          # 2D lidar: every return lies in the scan plane, so the height window must not
          # filter on odom z. That z = estimated altitude - 0.15 m lidar mount, which is
          # NEGATIVE on the floor and drifts with the baro; a 0.10 m floor here dropped
          # every return whenever the drone sat on the ground (empty costmaps).
          min_obstacle_height: -100.0
          max_obstacle_height: 100.0

          marking: true
          clearing: true

          obstacle_min_range: 0.10
          obstacle_max_range: 8.0

          raytrace_min_range: 0.10
          raytrace_max_range: 8.0

          inf_is_valid: true

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        inflation_radius: 0.40
        cost_scaling_factor: 3.0

      always_send_full_costmap: true


behavior_server:
  ros__parameters:
    use_sim_time: false

    global_frame: odom
    robot_base_frame: base_link

    transform_tolerance: 0.3

    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]

    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"


waypoint_follower:
  ros__parameters:
    use_sim_time: false


velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 10.0

    feedback: "OPEN_LOOP"

    scale_velocities: false

    max_velocity: [0.5, 0.5, 0.0]
    min_velocity: [-0.5, -0.5, 0.0]

    max_accel: [0.5, 0.5, 0.0]
    max_decel: [-0.5, -0.5, 0.0]

    odom_topic: /odom
    odom_duration: 0.1

    deadband_velocity: [0.0, 0.0, 0.0]

    velocity_timeout: 1.0


robot_state_publisher:
  ros__parameters:
    use_sim_time: false
