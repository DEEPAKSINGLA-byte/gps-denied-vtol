# Nav2 parameters for the indoor office simulation (x500 + 2D lidar).
# Same structure as nav2_baylands.yaml, tuned for rooms and 1.6 m doorways:
#   * 5 cm cells; local costmap 6 x 6 m, global a rolling 40 x 40 m window;
#   * robot radius 0.45 m (x500 with propellers is ~0.76 m across), inflation
#     0.8 m with a gentle fall-off, and a stronger obstacle critic, so paths
#     and the controller keep to the middle of 1.6 m doorways and corridors;
#   * lidar ranges 4.5 m local / 8 m global;
#   * obstacle heights are heights above the floor (map, odom and
#     base_footprint are at floor level; the lidar hangs off base_link at
#     flying height, ~1.8 m): keep 0.3..3.5 m, which drops floor hits when
#     the drone tilts;
#   * 0.5 m/s top speed, 0.6 m/s^2, 0.25 m goal tolerance.
# Used by: ros2 launch x500_navigation sim_office.launch.py
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Replaced at launch by the installed behavior_trees/navigate_drone.xml
    # (Nav2's default tree minus the Spin and BackUp recoveries).
    default_nav_to_pose_bt_xml: navigate_drone.xml
    navigators:
    - navigate_to_pose
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    navigate_to_pose:
      plugin: nav2_bt_navigator/NavigateToPoseNavigator
bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: -0.5
      max_vel_x: 0.5
      min_vel_y: -0.5
      max_vel_y: 0.5
      min_vel_theta: 0.0
      max_vel_theta: 0.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      max_speed_theta: 0.0
      acc_lim_x: 0.6
      acc_lim_y: 0.6
      acc_lim_theta: 0.0
      decel_lim_x: -0.6
      decel_lim_y: -0.6
      decel_lim_theta: 0.0
      vx_samples: 15
      vy_samples: 15
      vtheta_samples: 1
      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.25
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - Oscillation
      - BaseObstacle
      - PathAlign
      - PathDist
      - GoalDist
      BaseObstacle.scale: 0.5
      PathAlign.scale: 10.0
      PathAlign.forward_point_distance: 0.2
      PathDist.scale: 20.0
      GoalDist.scale: 20.0
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 2.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlanner2D
      tolerance: 0.3
      allow_unknown: true
      downsample_costmap: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      robot_radius: 0.45
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.3
          max_obstacle_height: 3.5
          obstacle_min_range: 0.25
          obstacle_max_range: 4.5
          raytrace_min_range: 0.25
          raytrace_max_range: 6.0
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
      transform_tolerance: 0.5
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 2.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      width: 40
      height: 40
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.45
      plugins:
      - static_layer
      - obstacle_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: true
          min_obstacle_height: 0.3
          max_obstacle_height: 3.5
          obstacle_min_range: 0.25
          obstacle_max_range: 8.0
          raytrace_min_range: 0.25
          raytrace_max_range: 9.5
          inf_is_valid: false
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.8
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
      transform_tolerance: 0.5
behavior_server:
  ros__parameters:
    use_sim_time: true
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
waypoint_follower:
  ros__parameters:
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 10.0
    feedback: OPEN_LOOP
    scale_velocities: false
    max_velocity:
    - 0.5
    - 0.5
    - 0.0
    min_velocity:
    - -0.5
    - -0.5
    - 0.0
    max_accel:
    - 0.6
    - 0.6
    - 0.0
    max_decel:
    - -0.6
    - -0.6
    - 0.0
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    velocity_timeout: 1.0
robot_state_publisher:
  ros__parameters:
    use_sim_time: true
