# explore_lite (m-explore-ros2) for the indoor office simulation.
# It reads the SLAM map, picks the most promising frontier (edge between
# known free space and unknown space) and sends it to Nav2 as a goal, until
# no frontier is left; then it flies back to the take-off point.
# Used by: ros2 launch x500_navigation sim_office.launch.py (explore:=true)
/**:
  ros__parameters:
    use_sim_time: true
    robot_base_frame: base_footprint
    costmap_topic: map              # slam_toolbox's /map (full map each update)
    costmap_updates_topic: map_updates
    visualize: true                 # frontiers as markers on /explore/frontiers
    planner_frequency: 0.5          # re-pick a frontier every 2 s
    progress_timeout: 20.0          # give up on a frontier after 20 s without progress
    potential_scale: 3.0            # weight of distance to the frontier
    orientation_scale: 0.0          # the drone does not turn, heading is irrelevant
    gain_scale: 1.0                 # weight of frontier size
    transform_tolerance: 0.5
    min_frontier_size: 0.5          # ignore frontiers shorter than 0.5 m
    return_to_init: true            # fly back to the start when done
